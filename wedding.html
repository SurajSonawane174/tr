    <script>
        document.addEventListener("DOMContentLoaded", function() {
    const galleryContainer = document.getElementById("gallery");

    // Example data (replace with your actual data)
    const weddingAlbum = [
        { imageSrc: "slider2.jpg", text: "Pranali Weds Karan", link: "album1.html" },
        { imageSrc: "a2slider1.jpg", text: "Nikita Weds Atul", link: "album2.html" },
        { imageSrc: "img1.jpg", text: "Gayatri Weds Yogesh", link: "album3.html" },
        { imageSrc: "a4slider1.jpg", text: "Pooja Weds Mayur", link: "album4.html" },
        { imageSrc: "a5slider1.jpg", text: "Sonali Weds Vikas", link: "album5.html" },
        { imageSrc: "a6slider1.jpg", text: "Pravin Weds Pranjal", link: "album6.html" },
        { imageSrc: "slider2.jpg", text: "Pranali Weds Karan", link: "album1.html" },
        { imageSrc: "a2slider1.jpg", text: "Nikita Weds Atul", link: "album2.html" },
        { imageSrc: "img1.jpg", text: "Gayatri Weds Yogesh", link: "album3.html" },
        { imageSrc: "a4slider1.jpg", text: "Pooja Weds Mayur", link: "album4.html" },
        { imageSrc: "a5slider1.jpg", text: "Sonali Weds Vikas", link: "album5.html" },
        { imageSrc: "a6slider1.jpg", text: "Pravin Weds Pranjal", link: "album6.html" },
        // Add more objects for additional photos
    ];

    // Loop through weddingAlbum and create HTML for each item
    weddingAlbum.forEach(item => {
        const galleryItem = document.createElement("div");
        galleryItem.classList.add("gallery-item");

        const anchor = document.createElement("a");
        anchor.href = item.link; // Set the link URL here
        anchor.target = "_blank"; // Opens link in a new tab

        const img = document.createElement("img");
        img.src = item.imageSrc; // Replace with actual image source
        img.alt = "Bride or Groom";

        const p = document.createElement("p");
        p.textContent = item.text;

        anchor.appendChild(img);
        galleryItem.appendChild(anchor);
        galleryItem.appendChild(p);
        galleryContainer.appendChild(galleryItem);
    });
    ScrollReveal({
            reset: true,
            distance: "50px",
            duration: 2000,
            delay: 100
        });

        ScrollReveal().reveal('.gallery-item', { origin: 'bottom'});
});

    </script>
     <script>
        document.addEventListener('DOMContentLoaded', () => {
            const activePage = window.location.pathname.split('/').pop();
            const navLinks = document.querySelectorAll('nav a');

            // Set the active class based on the current page
            navLinks.forEach(link => {
                if (link.getAttribute('href') === activePage) {
                    link.classList.add('active');
                }
            });

            // Add click event listeners to all nav links
            navLinks.forEach(link => {
                link.addEventListener('click', () => {
                    // Remove active class from all links
                    navLinks.forEach(link => link.classList.remove('active'));
                    // Add active class to the clicked link
                    link.classList.add('active');
                });
            });
        });
    </script>
