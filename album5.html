<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonali WEDS Vikas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            animation: fadeIn 1s ease-in;
            overflow-x: hidden;
            padding: 2rem; /* Added padding to prevent overlap with .heading */
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 80%;
            height: 80vh;
            position: relative;
            padding-top: 2rem; /* Adjusted for .heading */
        }

        .left-container {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            margin-right: 10%;
        }

        .heading {
            position: fixed; /* Changed to fixed to keep at top left corner */
            top: 0;
            left: 0;
            padding: 1rem;
            font-size: 1rem;
            color: #fff;
            cursor: pointer;
            text-decoration: none;
            z-index: 1000; /* Ensure it stays above other elements */
        }

        .bride-groom {
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            font-size: 3rem;
            color: #fff;
            font-style: italic;
            z-index: 1;
        }

        .arrow {
            bottom: 20px;
            left: 20px;
            cursor: pointer;
            transition: transform 0.3s ease;
            color: #fff;
        }

        .arrow:hover {
            transform: translateX(10px);
        }

        .btn {
            position: relative;
            bottom: 2rem;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: .7rem;
            color: #fff;
        }

        .btn a {
            color: #fff;
            text-decoration: none;
            font-style: italic;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: .7rem;
        }

        .btn a img {
            height: 40px;
            transition: all .3s ease;
        }

        .right-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            max-height: 80vh;
        }

        .image {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            overflow: hidden;
            animation: fadeIn 2s ease-in;
        }

        .carousel {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .carousel-inner {
            display: flex;
            width: 110%;
            transition: transform 0.5s ease-in-out;
        }

        .carousel-item {
            min-width: 100%;
            box-sizing: border-box;
        }

        .carousel-item img {
            width: 110%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
                padding-top: 4rem; /* Adjusted for .heading */
            }

            .bride-groom {
                position: static;
                transform: none;
                text-align: center;
                margin: 20px 0;
            }

            .image {
                width: 100%;
                height: 400px;
                margin: 20px 0;
            }

            .arrow {
                position: static;
                margin: 20px 0;
                display: block;
                text-align: center;
            }
            .btn{
                bottom: 0;
            }
        }

        @media(max-width:425px) {
            .right-container {
                height: fit-content;
            }
            .btn{
                bottom: 0;
            }
        }
    </style>
</head>

<body>
    <a target="_blank" href="index.html" class="heading">Aarambh Photography</a>

    <div class="container">
        <div class="left-container">
            <div class="bride-groom">
                <p>SONALI <span>WEDS</span></p>
                <p>VIKAS</p>
            </div>
        </div>
        <div class="right-container">
            <div class="image">
                <div class="carousel">
                    <div class="carousel-inner" id="carouselInner">
                        <!-- Images will be dynamically inserted here -->
                    </div>
                </div>
            </div>
        </div>
        <div class="btn">
            <span>View Photos</span>
            <a href="al">
                <img class="arrow" src="icons8-arrow-50.png" alt="">
            </a>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const carouselInner = document.getElementById("carouselInner");

            const weddingAlbum = [
            { imageSrc: "a5slider1.jpg" },
                { imageSrc: "a5slider2.jpg" },
                { imageSrc: "a5slider3.jpg" },
                { imageSrc: "a5slider4.jpg" },
                { imageSrc: "a5slider5.jpg" },
            ];

            weddingAlbum.push({ ...weddingAlbum[0] });

            weddingAlbum.forEach(item => {
                const carouselItem = document.createElement("div");
                carouselItem.classList.add("carousel-item");

                const img = document.createElement("img");
                img.src = item.imageSrc;
                img.alt = "Bride or Groom";

                carouselItem.appendChild(img);
                carouselInner.appendChild(carouselItem);
            });

            let index = 0;
            const totalItems = weddingAlbum.length;

            function showNextSlide() {
                index++;
                if (index >= totalItems) {
                    carouselInner.style.transition = 'none';
                    carouselInner.style.transform = 'translateX(0)';
                    index = 1;
                    setTimeout(() => {
                        carouselInner.style.transition = 'transform 0.5s ease-in-out';
                        carouselInner.style.transform = `translateX(-${index * 100}%)`;
                    }, 0);
                } else {
                    carouselInner.style.transform = `translateX(-${index * 100}%)`;
                }
            }

            setInterval(showNextSlide, 3000);
        });
    </script>
</body>

</html>
