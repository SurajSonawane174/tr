<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRANALI WEDS KARAN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            /* font-family: Arial, sans-serif; */
            animation: fadeIn 1s ease-in;
            overflow-x: hidden;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 80%;
            height: 80vh;
            position: relative;
        }

        .left-container {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            margin-right: 10%;
        }

        .heading {
            position: absolute;
            top: 2rem;
            left: 2rem;
            font-size: 1rem;
            color: #fff;
            height: fit-content;
            width: 100%;
            cursor: pointer;
            text-decoration: none;
        }
        

        .bride-groom {
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            font-size: 3rem;
            color: #fff;
            font-style: italic;

        }

        .arrow {
            /* position: absolute; */
            bottom: 20px;
            left: 20px;
            cursor: pointer;
            transition: transform 0.3s ease;
            color: #fff;
        }

        .arrow:hover {
            transform: translateX(10px);
        }

        .btn {
            position: relative;
            bottom: -20px;
            /* left: 20px; */
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: .7rem;
            color: #fff;
            /* cursor: pointer; */
        }

        .btn a {
            color: #fff;
            text-decoration: none;
            font-style: italic;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: .7rem;
        }

        .btn a img {
            height: 40px;
            transition: all .3s ease;
        }

        .right-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .image {
            width: 100%;
            height: 100%;
            /* background-color: #fff; */
            border-radius: 10px;
            overflow: hidden;
            animation: fadeIn 2s ease-in;
        }

        .carousel {
            position: relative;
            width: 100%;
            height: 100%;
            /* margin-left: 10%; */
            overflow: hidden;
            /* border-radius: 10px; */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .carousel-inner {
            display: flex;
            width: 110%;
            transition: transform 0.5s ease-in-out;
        }

        .carousel-item {
            min-width: 100%;
            box-sizing: border-box;
        }

        .carousel-item img {
            width: 110%;
            height: auto;
            object-fit: cover;
            /* border-radius: 10px; */
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
                top: 10vw;
            }
            .heading{
                bottom: 10vw;
            }

            .left-container,
            .right-container {
                align-items: center;
                justify-content: center;
            }

            /* .heading {
                position: static;
                text-align: center;
                margin: 20px 0;
            } */
            .bride-groom {
                position: static;
                transform: none;
                text-align: center;
                margin: 20px 0;
            }

            .image {
                width: 100%;
                height: fit-content;
                margin: 20px 0;
            }

            .arrow {
                position: static;
                margin: 20px 0;
                display: block;
                text-align: center;
            }
        }
        @media(max-width:425px){
            
            .right-container{
                height: fit-content;
            }
        }
    </style>
</head>

<body>
    <a target="_blank" href="index.html" class="heading">Aarambh Photography</a>
    

    <div class="container">
        <div class="left-container">
            <div class="bride-groom">
                <p>PRANALI
                    <span>WEDS</span>
                </p>
                <p>KARAN</p>
            </div>

        </div>
        <div class="right-container">
            <div class="image">
                <div class="carousel">
                    <div class="carousel-inner" id="carouselInner">
                        <!-- Images will be dynamically inserted here -->
                    </div>
                </div>

            </div>
        </div>
        <div class="btn">
            <span>View Photos</span>
            <a href="al">
                <img class="arrow" src="icons8-arrow-50.png" alt="">
            </a>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const carouselInner = document.getElementById("carouselInner");

            // Example data (replace with your actual data)
            const weddingAlbum = [
                { imageSrc: "slider2.jpg" },
                { imageSrc: "slider1.jpg" },
                { imageSrc: "slider3.jpg" },
                { imageSrc: "slider4.jpg" },
                { imageSrc: "slider5.jpg" }
            ];

            // Duplicate the first item and append it to the end
            weddingAlbum.push({ ...weddingAlbum[0] });

            // Loop through weddingAlbum and create HTML for each item
            weddingAlbum.forEach(item => {
                const carouselItem = document.createElement("div");
                carouselItem.classList.add("carousel-item");

                const img = document.createElement("img");
                img.src = item.imageSrc; // Replace with actual image source
                img.alt = "Bride or Groom";

                const caption = document.createElement("div");
                caption.classList.add("carousel-caption");
                caption.textContent = item.text;

                carouselItem.appendChild(img);
                carouselItem.appendChild(caption);
                carouselInner.appendChild(carouselItem);
            });

            let index = 0;
            const totalItems = weddingAlbum.length;
            function showNextSlide() {
                index++;
                if (index >= totalItems) {
                    carouselInner.style.transition = 'none';
                    carouselInner.style.transform = 'translateX(0)';
                    index = 1; // Reset to the second item (first duplicate)
                    setTimeout(() => {
                        carouselInner.style.transition = 'transform 0.5s ease-in-out';
                        carouselInner.style.transform = `translateX(-${index * 100}%)`;
                    }, 0);
                } else {
                    carouselInner.style.transform = `translateX(-${index * 100}%)`;
                }
            }

            setInterval(showNextSlide, 3000); // Change slide every 3 seconds
        });
    </script>
</body>

</html>
